<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" width="240" height="64" role="img" aria-label="Mizaan">
  <title>Mizaan</title>
  <!--
    Horizontal lockup: mark + wordmark. Used in the navbar and PDF cover.

    The mark is the same green tile as the app icon (see
    src/components/MizanAILogo.jsx and mizan-ai-logo-square.svg): a white
    balance on an emerald→deep-teal rounded square with blended sides. Keeping
    all three files identical means the brand reads the same in the navbar, as
    a favicon and on a report cover.
    `currentColor` on the tagline makes the lockup adapt to dark/light mode.
  -->
  <defs>
    <linearGradient id="mizanTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="55%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <linearGradient id="mizanSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#mizanTile)" />
  <rect width="64" height="64" rx="15" fill="url(#mizanSheen)" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="14.25" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5" />

  <g fill="none" stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15 26H49" />
    <path d="M32 26V45" />
    <path d="M23 46H41" />
    <path d="M10 30q6 8 12 0" />
    <path d="M42 30q6 8 12 0" />
  </g>

  <circle cx="32" cy="19" r="4.6" fill="#FBBF24" />
  <circle cx="32" cy="19" r="1.7" fill="#FFFFFF" opacity="0.95" />

  <text x="74" y="34" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="23" font-weight="700" letter-spacing="0.5" fill="#FFFFFF">MIZAAN</text>
</svg>
