<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" width="240" height="64" role="img" aria-label="Mizaan">
  <title>Mizaan</title>
  <!--
    Horizontal lockup: mark + wordmark. Used in the navbar and PDF cover.
    Brand DNA retained from the original mark: teal-to-emerald gradient with a
    gold accent, and the balance-scale (mizan) motif. Rebuilt as pure geometry
    on a 64-unit grid so it stays crisp at small sizes.
    `currentColor` on the wordmark makes the lockup adapt to dark/light mode.
  -->
  <defs>
    <linearGradient id="mizanTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="60%" stop-color="#075e4c" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="mizanGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <g fill="none" stroke="url(#mizanTeal)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 22H51" />
    <path d="M32 22V47" />
    <path d="M22 48H42" />
    <path d="M13 22v4" />
    <path d="M51 22v4" />
    <path d="M5 26q8 10 16 0" />
    <path d="M43 26q8 10 16 0" />
  </g>

  <circle cx="32" cy="15" r="5" fill="url(#mizanGold)" />
  <circle cx="32" cy="15" r="1.9" fill="#FFFFFF" opacity="0.92" />

  <text x="74" y="34" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="23" font-weight="700" letter-spacing="0.5" fill="#064e3b">MIZAAN</text>
  <text x="75" y="48" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="7.5" font-weight="600" letter-spacing="2.2" fill="currentColor" opacity="0.6">SHARIAH COMPLIANCE INTELLIGENCE</text>
</svg>
