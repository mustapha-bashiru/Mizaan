[pytest]
# Restrict discovery to the real suite. Without this, pytest's default
# "*_test.py" pattern also matches ad-hoc scripts elsewhere in the tree and
# executes their module-level side effects during collection.
testpaths = tests
python_files = test_*.py
# The suite imports the application modules (database, main, models) by their
# top-level names. Those live in the repository root, which pytest does not add
# to sys.path on its own because the root holds no conftest.py.
pythonpath = .


